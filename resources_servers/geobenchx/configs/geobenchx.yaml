geobenchx_resources_server:
  resources_servers:
    geobenchx:
      entrypoint: app.py
      domain: agent
      verified: false
      description: GeoBenchX 202-task multistep geospatial tool-calling regression benchmark.
      datasets:
      - name: benchmark
        type: example
        jsonl_fpath: resources_servers/geobenchx/data/benchmark.jsonl
        num_repeats: 1
        license: MIT

geobenchx_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: geobenchx_resources_server
      model_server:
        type: responses_api_models
        name: policy_model

geobenchx_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: geobenchx_simple_agent
